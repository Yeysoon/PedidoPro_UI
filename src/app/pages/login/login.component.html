<div class="login-page">
  <div class="login-backdrop"></div>

  <div class="login-card glass-card">
    <div class="brand">
      <div class="brand-badge">
        <span class="material-icons brand-icon">restaurant</span>
      </div>
      <h1 class="brand-name">Pedido<span>Pro</span></h1>
      <p class="brand-sub">Sistema de Gestión de Restaurante</p>
    </div>

    <form class="login-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <div class="input-wrap">
          <span class="material-icons input-icon">mail_outline</span>
          <input id="email" name="email" class="form-control" type="email"
                 placeholder="admin@pedidopro.com"
                 [(ngModel)]="email" autocomplete="email" required/>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrap">
          <span class="material-icons input-icon">lock_outline</span>
          <input id="password" name="password" class="form-control"
                 [type]="showPwd() ? 'text' : 'password'"
                 placeholder="••••••••"
                 [(ngModel)]="password" autocomplete="current-password" required/>
          <button type="button" class="pwd-toggle" (click)="showPwd.update(v => !v)">
            <span class="material-icons">{{ showPwd() ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-gold submit-btn" [disabled]="loading()">
        @if (loading()) {
          <span class="material-icons spin-icon">sync</span> Ingresando...
        } @else {
          <span class="material-icons">login</span> Ingresar
        }
      </button>
    </form>

    <div class="card-footer">
      <span>PedidoPro v1.0 · Panel Administrativo</span>
    </div>
  </div>
</div>
